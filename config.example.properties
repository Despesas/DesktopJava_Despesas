# Configuracao do Despesas (exemplo, sem credenciais reais).
# Copie para "config.properties" (no diretorio onde o app e executado) ou para
# "~/.despesas/config.properties", ou aponte com -Ddespesas.config=/caminho/arquivo.
# O config.properties esta no .gitignore: nunca versione senhas.

# Driver JDBC (MySQL Connector/J 5.1 em lib/)
db.driver=com.mysql.jdbc.Driver

# Banco de contas usado na tela de login (tabela usuario_server).
account.url=jdbc:mysql://localhost:3306/despesas
account.usuario=usuario
account.senha=senha

# Banco de despesas.
# Com db.url definido, o app usa estes dados diretamente.
# Sem db.url, usa a conexao gravada pelo login a partir da tabela usuario_server
# (url_server, porta_server, user_server, senha_server) no arquivo de sessao abaixo.
db.url=jdbc:mysql://localhost:3306/despesas
db.usuario=usuario
db.senha=senha

# Arquivo onde o login grava a conexao do usuario (padrao: ~/.despesas/bancodedados.properties)
#sessao.arquivo=/caminho/para/bancodedados.properties
